sonar.projectKey=Next-Task-Manager
sonar.projectName=Next Task Manager
sonar.projectVersion=1.0

# Путь к исходникам (обычно корень или папка src)
sonar.sources=.

# Исключения (КРИТИЧНО для Next.js, чтобы не сканировать гигабайты мусора)
sonar.exclusions=**/node_modules/**, **/.next/**, **/out/**, **/public/**, **/*.config.js, **/coverage/**

# Указываем, что это JS/TS проект
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8